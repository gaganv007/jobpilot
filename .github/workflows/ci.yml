name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # jd_agent (the private resume project) is not present in CI, so the tests
      # that depend on it skip automatically. The rubric gate/cap logic, extraction
      # parsing, tailoring honesty guard, research/prep/packet, batch locks, and
      # calibration all run here.
      - name: Run tests
        run: pytest -q
